<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="disp-container">
            <textarea id="logbox" class="disp num-disp" rows="1" cols="20" readonly disabled></textarea>
            <textarea id="activebox" class="disp output-disp" rows="1" cols="20" readonly disabled>0</textarea>
        </div>
        <div class="num-pad">
            <div class="num-row">
                <button class="num option">AC</button>
                <button class="num option">+/-</button>
                <button class="num option">%</button>
                <button class="num operator">/</button>
            </div>
            <div class="num-row">
                <button class="num">7</button>
                <button class="num">8</button>
                <button class="num">9</button>
                <button class="num operator">x</button>
            </div><div class="num-row">
                <button class="num">4</button>
                <button class="num">5</button>
                <button class="num">6</button>
                <button class="num operator">-</button>
            </div><div class="num-row">
                <button class="num">1</button>
                <button class="num">2</button>
                <button class="num">3</button>
                <button class="num operator">+</button>
            </div><div class="num-row">
                <button class="num">DE</button>
                <button class="num">0</button>
                <button class="num">.</button>
                <button class="num operator">=</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
